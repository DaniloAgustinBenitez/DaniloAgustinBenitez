name: Póster del perfil

# Regenera assets/poster.svg con las contribuciones del día.
on:
  schedule:
    - cron: "0 6 * * *" # todos los días a las 03:00 de Argentina
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/poster.yml"]

permissions:
  contents: write

concurrency:
  group: poster
  cancel-in-progress: true

jobs:
  dibujar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar el póster
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERFIL: ${{ github.repository_owner }}
        run: python tools/poster.py

      - name: Commit si cambió
        run: |
          if git diff --quiet -- assets; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/poster.svg
          git commit -m "chore: actualizar contribuciones del póster"
          git push
